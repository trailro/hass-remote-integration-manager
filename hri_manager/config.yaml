# HRI Manager: creates, updates and removes instances of hass-remote-integration as local apps.  Reference: DOCS.md
# and the README.
name: HRI Manager
# version, and the image: line below it once there is one, are written only by the Image workflow's app-version job
# (.github/workflows/image.yml), after that version's image is on ghcr.io and anyone can pull it: never by hand, never
# in a release (the store would offer a version whose image does not exist).  Without an image: line the Supervisor
# builds this folder's Dockerfile on the device.
version: "0.1.0"
slug: hri_manager
description: Run several hass-remote-integration instances on one Home Assistant OS, one integration each
url: https://github.com/trailro/hass-remote-integration-manager
# experimental in 0.1.0: the manager holds the manager role and writes local apps; it earns "stable" after a
# release cycle on real installs
stage: experimental
# the same floor as hass-remote-integration, whose instances this creates
homeassistant: "2025.10.0"
arch:
  - aarch64
  - amd64
# The manager role is what installing, updating and removing local apps needs.  It also allows much more (any app,
# backups, the host): the code restricts itself to an allow-list of calls (hrimgr/supervisor.py), and changes only
# the apps it created, recognised by the marker in their folder
hassio_api: true
hassio_role: manager
# Core's websocket through the Supervisor's proxy, for one command: config/auth/list, to serve only Home Assistant's
# administrators (the ingress headers say who asks, not whether they are one).  Costs no security rating
homeassistant_api: true
# the local apps folder, where each instance's definition is written (hri_<name>/)
map:
  - type: local_apps
    read_only: false
# the UI is the sidebar panel only: no port is published, and the app serves only requests the Supervisor proxies
ingress: true
panel_icon: mdi:server-network
panel_title: HRI Manager
options:
  allowed_users: []
  debug: false
schema:
  allowed_users: ["str?"]
  github_token: password?
  debug: bool
