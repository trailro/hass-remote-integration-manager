configuration:
  allowed_users:
    name: Home Assistant users
    description: Only these Home Assistant administrators (user names or user ids) may use the manager. The manager is for administrators only in any case, checked on every request; empty means every administrator.
  github_token:
    name: GitHub token
    description: Optional. A token without scopes raises GitHub's rate limit for the release list (60 an hour per address without one). Sent only to api.github.com.
  debug:
    name: Debug logging
    description: More detail in the app's log.
