configuration:
  allowed_users:
    name: Home Assistant users
    description: Only these Home Assistant administrators may use the manager, matched on the user id Home Assistant verifies, or the login name it reports for that id (never the display name). The manager is for administrators only in any case, checked on every request; empty means every administrator, and entries that are all blank refuse everyone. It is not a boundary between administrators, since any of them can change this option.
  github_token:
    name: GitHub token
    description: Optional. A token without scopes raises GitHub's rate limit for the release list (60 an hour per address without one). Sent only to api.github.com.
  debug:
    name: Debug logging
    description: More detail in the app's log.
