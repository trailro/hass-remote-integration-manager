# Monthly version updates: the Actions (pinned by SHA), the app's Python requirements and its base image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # requirements.in names the app's dependencies; requirements.txt is its pip-compile lock (--generate-hashes), which
  # Dependabot compiles again when it bumps one (its pip ecosystem reads only *.in and *.txt files)
  - package-ecosystem: pip
    directory: /hri_manager
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /hri_manager
    schedule:
      interval: monthly
